<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #0E0E11;
      --muted: #6B6B73;
      --terracotta: #B4442A;
      --hairline: #E4E4E7;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      background: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Brand accent band */
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--terracotta);
    }

    .content {
      position: absolute;
      top: 86px;
      left: 80px;
      width: 640px;
    }

    /* Wordmark row */
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 52px;
    }
    .brand img { height: 56px; width: auto; display: block; }
    .brand .name {
      font-family: 'Bodoni Moda', 'Bodoni 72', 'Didot', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 {
      font-family: 'Bodoni Moda', 'Bodoni 72', 'Didot', Georgia, serif;
      font-size: 78px;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.025em;
      margin-bottom: 30px;
    }
    h1 em {
      font-style: italic;
      color: var(--terracotta);
    }

    .subtitle {
      font-size: 25px;
      font-weight: 300;
      line-height: 1.45;
      letter-spacing: -0.012em;
      color: var(--muted);
      max-width: 560px;
      margin-bottom: 44px;
    }

    .tags { display: flex; gap: 12px; flex-wrap: wrap; }
    .tag {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.006em;
      color: var(--ink);
      padding: 9px 18px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
    }

    /* Logo mark, floated right, sits on the seamless white field */
    .mark {
      position: absolute;
      top: 196px;
      right: 76px;
      width: 408px;
      height: auto;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      left: 80px; right: 80px; bottom: 54px;
      padding-top: 28px;
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bottom-bar .url {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 400;
      color: var(--muted);
    }
    .badge .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--terracotta);
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>

  <img class="mark" src="impulso-mark.png" alt="Impulso Co." />

  <div class="content">
    <div class="brand">
      <img src="impulso-mark.png" alt="" />
      <span class="name">Impulso Co.</span>
    </div>
    <h1>Wij bouwen jouw<br /><em>digitale team</em></h1>
    <p class="subtitle">AI-agents die samenwerken, delegeren en uitvoeren — live in 2 weken.</p>
    <div class="tags">
      <span class="tag">Klantenservice</span>
      <span class="tag">Sales</span>
      <span class="tag">Operations</span>
      <span class="tag">Kennisbank</span>
    </div>
  </div>

  <div class="bottom-bar">
    <span class="url">impulsoco.nl</span>
    <div class="badge">
      <span class="dot"></span>
      Amsterdam, NL · 18+ bedrijven
    </div>
  </div>
</body>
</html>
